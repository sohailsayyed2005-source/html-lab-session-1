<!DOCTYPE html>
<html>
<head><title>Text Formatting</title></head>
<body>
    <h1>College Notice</h1>
    <p><b>NOTICE</b></p>
    <p><i>All students are informed</i> that the annual gathering will be held on Friday.</p>
    <p><u>Venue: College Auditorium</u></p>
    <p>Registration fee: Rs. 100<sup>only</sup></p>
    <p>Water formula: H<sub>2</sub>O</p>
    <blockquote>Education is the key to success.</blockquote>
    <p>Use the <code>&lt;h1&gt;</code> tag to create a main heading.</p>
</body>
</html>

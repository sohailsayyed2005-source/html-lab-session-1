<!DOCTYPE html>
<html>
<head><title>HTML Tables</title></head>
<body>
    <h1>Student Marksheet</h1>
    <table border="1" cellpadding="8">
        <tr><th>Subject</th><th>Marks</th><th>Maximum Marks</th></tr>
        <tr><td>Python</td><td>78</td><td>100</td></tr>
        <tr><td>DBMS</td><td>82</td><td>100</td></tr>
        <tr><td>Web Technology</td><td>85</td><td>100</td></tr>
    </table>
    <h1>Class Timetable</h1>
    <table border="1" cellpadding="8">
        <tr><th>Day</th><th>9-10 AM</th><th>10-11 AM</th></tr>
        <tr><td>Monday</td><td>Python</td><td>DBMS</td></tr>
        <tr><td>Tuesday</td><td>Web Technology</td><td>Java</td></tr>
    </table>
    <h1>Fee Receipt</h1>
    <table border="1" cellpadding="8">
        <tr><th>Receipt No.</th><td>101</td></tr>
        <tr><th>Student Name</th><td>Student Name</td></tr>
        <tr><th>Course Fee</th><td>Rs. 25,000</td></tr>
        <tr><th>Payment Status</th><td>Paid</td></tr>
    </table>
</body>
</html>

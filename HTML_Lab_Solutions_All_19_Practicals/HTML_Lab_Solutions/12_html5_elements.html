<!DOCTYPE html>
<html>
<head><title>HTML5 Elements</title></head>
<body>
    <h1>HTML5 Elements Demonstration</h1>
    <details><summary>About HTML</summary><p>HTML is used to create web page structure.</p></details>
    <h2>Course Progress</h2>
    <progress value="70" max="100">70%</progress>
    <h2>Skill Level</h2>
    <meter value="8" min="0" max="10">8 out of 10</meter>
    <h2>Figure</h2>
    <figure>
        <img src="https://placehold.co/250x130?text=College" alt="College" width="250">
        <figcaption>Figure 1: Sample college image</figcaption>
    </figure>
    <h2>Dialog</h2>
    <dialog open>This is an HTML dialog element.</dialog>
</body>
</html>

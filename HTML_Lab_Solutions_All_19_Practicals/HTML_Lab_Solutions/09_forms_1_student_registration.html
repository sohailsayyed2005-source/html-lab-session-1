<!DOCTYPE html>
<html>
<head><title>Student Registration Form</title></head>
<body>
    <h1>Student Registration Form</h1>
    <form>
        <label>Full Name:</label><input type="text" name="fullname"><br><br>
        <label>Password:</label><input type="password" name="password"><br><br>
        <label>Email:</label><input type="email" name="email"><br><br>
        <label>Phone:</label><input type="tel" name="phone"><br><br>
        <label>Date of Birth:</label><input type="date" name="dob"><br><br>
        <label>Gender:</label>
        <input type="radio" name="gender" value="Male">Male
        <input type="radio" name="gender" value="Female">Female<br><br>
        <label>Hobbies:</label>
        <input type="checkbox" name="hobby" value="Reading">Reading
        <input type="checkbox" name="hobby" value="Sports">Sports<br><br>
        <label>Course:</label>
        <select name="course"><option>MCA</option><option>BCA</option><option>BBA</option></select><br><br>
        <label>Address:</label><textarea name="address" rows="4" cols="30"></textarea><br><br>
        <label>Upload Photo:</label><input type="file" name="photo"><br><br>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </form>
</body>
</html>

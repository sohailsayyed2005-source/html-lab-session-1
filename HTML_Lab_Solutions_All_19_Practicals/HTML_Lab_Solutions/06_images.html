<!DOCTYPE html>
<html>
<head><title>Images and Gallery</title></head>
<body>
    <h1>Image Demonstration</h1>
    <h2>Image with size</h2>
    <img src="https://placehold.co/300x180?text=College+Image" alt="College sample" width="300" height="180">
    <h2>Image as hyperlink</h2>
    <a href="https://www.wikipedia.org" target="_blank">
        <img src="https://placehold.co/150x100?text=Click+Me" alt="Clickable sample image" width="150">
    </a>
    <h2>Image Gallery</h2>
    <img src="https://placehold.co/180x120?text=Image+1" alt="Gallery image 1" width="180">
    <img src="https://placehold.co/180x120?text=Image+2" alt="Gallery image 2" width="180">
    <img src="https://placehold.co/180x120?text=Image+3" alt="Gallery image 3" width="180">
</body>
</html>

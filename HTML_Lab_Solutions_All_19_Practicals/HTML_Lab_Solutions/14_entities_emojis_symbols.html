<!DOCTYPE html>
<html>
<head><title>HTML Entities and Symbols</title></head>
<body>
    <h1>HTML Entities, Emojis and Symbols</h1>
    <p>Less than: &lt;</p>
    <p>Greater than: &gt;</p>
    <p>Ampersand: &amp;</p>
    <p>Copyright: &copy; 2026</p>
    <p>Registered: &reg;</p>
    <p>Rupee: &#8377; 500</p>
    <p>Heart: &#10084;</p>
    <p>Smile emoji: &#128512; &#128525; &#128526;</p>
    <p>Mathematical symbols: &plusmn; &times; &divide; &infin;</p>
</body>
</html>

<!DOCTYPE html>
<html>
<head><title>Multimedia</title></head>
<body>
    <h1>Audio, Video and YouTube</h1>
    <h2>Audio</h2>
    <audio controls>
        <source src="sample-audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>
    <p>Place a file named sample-audio.mp3 in this folder to play audio.</p>
    <h2>Video</h2>
    <video width="400" controls>
        <source src="sample-video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>
    <p>Place a file named sample-video.mp4 in this folder to play video.</p>
    <h2>YouTube Video</h2>
    <iframe width="400" height="225" src="https://www.youtube.com/embed/tgbNymZ7vqY" title="YouTube video" allowfullscreen></iframe>
</body>
</html>

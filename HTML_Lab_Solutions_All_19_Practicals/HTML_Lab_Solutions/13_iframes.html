<!DOCTYPE html>
<html>
<head><title>Iframes</title></head>
<body>
    <h1>Iframe Demonstration</h1>
    <h2>Website</h2>
    <iframe src="https://example.com" width="600" height="250" title="Example website"></iframe>
    <h2>YouTube Video</h2>
    <iframe width="400" height="225" src="https://www.youtube.com/embed/tgbNymZ7vqY" title="YouTube video" allowfullscreen></iframe>
    <h2>Google Maps</h2>
    <iframe src="https://www.google.com/maps?q=Pune&output=embed" width="600" height="300" title="Map of Pune"></iframe>
</body>
</html>
